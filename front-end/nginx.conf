# Never log capability URLs, query strings or referrers.
map $uri $sharing_log_uri {
    default $uri;
    ~*shared-projects /shared-projects/[redacted];
}
map $request_uri $sharing_access_log {
    default 1;
    ~*shared-projects 0;
}
log_format sharing_safe '$remote_addr - $remote_user [$time_local] "$request_method $sharing_log_uri $server_protocol" $status $body_bytes_sent';

# Restrict CMS writes without throttling public page/image reads.
map $request_method $website_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
    PATCH $binary_remote_addr;
}
limit_req_zone $website_write_key zone=website_writes:10m rate=30r/m;

server {
    listen 80;
    server_name fossbot.gr;
    access_log /var/log/nginx/access.log sharing_safe if=$sharing_access_log;
    add_header Referrer-Policy no-referrer always;

    # Certbot HTTP-01 validation stays available during certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fossbot.gr;
    access_log /var/log/nginx/access.log sharing_safe if=$sharing_access_log;
    add_header Referrer-Policy no-referrer always;

    ssl_certificate /etc/letsencrypt/live/fossbot.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fossbot.gr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Block sensitive hidden and system files globally
    location ~* \.(env|git|htaccess|sql|bak|sh)$ {
        deny all;
        return 404;
    }

    # 2. Matomo Analytics Application Gateway (^~ forces prefix match over regex)
    location ^~ /analytics/ {
        # Strict security: deny PHP execution inside temporary and user upload dirs
        location ~* ^/analytics/(tmp|upload|misc/user)/.*\.php$ {
            deny all;
            return 403;
        }

        proxy_pass http://matomo/;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 3. Matomo Direct Tracker Endpoint (used by landing page tracking code)
    location = /matomo.php {
        proxy_pass http://matomo/matomo.php;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 4. Global Block: Disallow execution of any .php file outside Matomo
    location ~* \.(php|phtml)$ {
        deny all;
        return 404;
    }

    # 5. Serve SPA static frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/index.html $uri/index.htm /index.html;
    }

    # 6. Backend API - Scoped CMS writes
    location /api/website/ {
        client_max_body_size 8m;
        limit_req zone=website_writes burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fsbt-back:8000/website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 7. Backend API - General
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://fsbt-back:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
