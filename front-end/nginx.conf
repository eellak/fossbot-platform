# Restrict CMS writes without throttling public page/image reads.
map $request_method $website_write_key {
    default "";
    POST $binary_remote_addr;
    PUT $binary_remote_addr;
    DELETE $binary_remote_addr;
    PATCH $binary_remote_addr;
}
limit_req_zone $website_write_key zone=website_writes:10m rate=30r/m;

server {
    listen 80;
    server_name fossbot.gr;

    # Certbot HTTP-01 validation stays available during certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fossbot.gr;

    ssl_certificate /etc/letsencrypt/live/fossbot.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fossbot.gr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve static files and fallback to index.html for SPA.
    # $uri/index.html (not $uri/) so a static directory whose name matches a
    # route (e.g. /stage-builder, /simulator) cannot shadow the SPA: a
    # directory without its own index falls through to the shell, not 403.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/index.html $uri/index.htm /index.html;
    }

    # CMS payloads include base64 images (5 MB raw); keep this bound scoped to CMS.
    location /api/website/ {
        client_max_body_size 8m;
        limit_req zone=website_writes burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://fsbt-back:8000/website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Proxy API requests to the backend server
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://fsbt-back:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Proxy Matomo requests to the Matomo container
    location /analytics/ {
        proxy_pass http://matomo/;
        rewrite ^/analytics/(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
