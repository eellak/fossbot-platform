# Never log capability URLs, query strings or referrers.
map $uri $sharing_log_uri {
    default $uri;
    ~*shared-projects /shared-projects/[redacted];
}
map $request_uri $sharing_access_log {
    default 1;
    ~*shared-projects 0;
}
log_format sharing_safe '$remote_addr - $remote_user [$time_local] "$request_method $sharing_log_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log sharing_safe if=$sharing_access_log;
    add_header Referrer-Policy no-referrer always;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # $uri/index.html (not $uri/) so a static directory named after a route
        # cannot shadow the SPA with a 403. Mirrors front-end/nginx.conf.
        try_files $uri $uri/index.html $uri/index.htm /index.html;
    }

    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://host.docker.internal:8000/;
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"detail":"The platform API is unavailable. Start the backend and try again."}';
    }
}
