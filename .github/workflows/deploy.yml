name: Deploy to SSH Server

on:
  workflow_dispatch:
    inputs:
      recover_disk_pressure:
        description: Verify the latest backup and reclaim unused Docker cache before taking a new backup
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          for name in \
            FIREBASE_API_KEY \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_PROJECT_ID \
            FIREBASE_STORAGE_BUCKET \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_APP_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing required Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: SSH and Deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} 'bash -se' << 'EOF'
            set -euo pipefail
            cd /fossbot-platform

            backup_dir=/fossbot-backups
            sudo mkdir -p "$backup_dir"

            # A prior guarded deployment may have filled the Docker filesystem
            # and left PostgreSQL in crash recovery. Recovery mode verifies the
            # latest backup before freeing unused cache, then waits for the
            # database to accept connections again.
            if [[ "${{ inputs.recover_disk_pressure }}" == "true" ]]; then
              latest_checksum=$(sudo sh -c 'ls -1t /fossbot-backups/*.dump.sha256 2>/dev/null | head -n 1')
              sudo test -n "$latest_checksum"
              sudo sha256sum --check "$latest_checksum"
              if ! sudo timeout --signal=TERM --kill-after=10s 2m docker builder prune --all --force; then
                echo "Docker builder cache cleanup timed out; continuing to the disk-space safety check."
              fi
              sudo docker image prune --force
            fi

            database_ready=false
            for attempt in {1..30}; do
              if sudo docker exec fsbt-db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null; then
                database_ready=true
                break
              fi
              sleep 2
            done
            if [[ "$database_ready" != true ]]; then
              echo "PostgreSQL did not recover after unused Docker cache was reclaimed." >&2
              exit 1
            fi

            postgres_version=$(sudo docker exec fsbt-db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW server_version_num"')
            if [[ "$postgres_version" != 16* ]]; then
              echo "Refusing deployment: production PostgreSQL is ${postgres_version}, expected major version 16." >&2
              exit 1
            fi

            # This is the deployment's hard safety gate. Everything above this
            # point is read-only; no code, image, container, or schema change is
            # allowed until a complete local PostgreSQL backup is verified.
            backup_timestamp=$(date -u +%Y%m%d-%H%M%SZ)
            backup_file="$backup_dir/fossbot-db-$backup_timestamp.dump"
            backup_partial="$backup_file.partial"
            backup_checksum="$backup_file.sha256"
            # Pre-create the partial dump privately. Rename it only after both
            # pg_dump and pg_restore's archive validation succeed, so a failed
            # deployment cannot leave a partial file looking like a valid dump.
            sudo install -m 600 /dev/null "$backup_partial"
            sudo docker exec fsbt-db sh -c 'exec pg_dump -Fc -U "$POSTGRES_USER" -d "$POSTGRES_DB"' \
              | sudo tee "$backup_partial" >/dev/null
            sudo test -s "$backup_partial"
            sudo sh -c "cat '$backup_partial' | docker exec -i fsbt-db pg_restore --list >/dev/null"
            sudo mv "$backup_partial" "$backup_file"
            sudo chmod 600 "$backup_file"
            sudo sha256sum "$backup_file" | sudo tee "$backup_checksum" >/dev/null
            sudo chmod 600 "$backup_checksum"
            sudo sha256sum --check "$backup_checksum"
            echo "Verified database backup: $backup_file"
            echo "Backup checksum: $backup_checksum"
            echo "Restore review: create an empty database, then stream this dump into pg_restore inside fsbt-db."

            sudo git -c safe.directory=/fossbot-platform fetch origin
            sudo git -c safe.directory=/fossbot-platform reset --hard origin/master

            sudo tee .env >/dev/null <<'ENV_FILE'
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
          FOSSBOT_BACKEND_URL=https://fossbot.gr/api
          MATOMO_DATABASE_HOST=${{ secrets.MATOMO_DATABASE_HOST }}
          MATOMO_DATABASE_USERNAME=${{ secrets.MATOMO_DATABASE_USERNAME }}
          MATOMO_DATABASE_PASSWORD=${{ secrets.MATOMO_DATABASE_PASSWORD }}
          MATOMO_DATABASE_DBNAME=${{ secrets.MATOMO_DATABASE_DBNAME }}
          MATOMO_TRUSTED_HOSTS=${{ secrets.MATOMO_TRUSTED_HOSTS }}
          MATOMO_ASSUME_SECURE_PROTOCOL=1
          MATOMO_PROXY_URI_HEADER=1
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MATOMO_DATABASE_DBNAME }}
          MYSQL_USER=${{ secrets.MATOMO_DATABASE_USERNAME }}
          MYSQL_PASSWORD=${{ secrets.MATOMO_DATABASE_PASSWORD }}
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          ENV_FILE

            sudo tee front-end/.env.production >/dev/null <<'FRONTEND_ENV'
          REACT_APP_BACKEND_URL=/api
          REACT_APP_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FRONTEND_ENV

            sudo docker compose -f docker-compose-production.yml config --quiet
            sudo docker compose -f docker-compose-production.yml build --pull

            # Build stages for the large frontend are not needed at runtime.
            # Reclaim them before PostgreSQL performs startup migrations.
            if ! sudo timeout --signal=TERM --kill-after=10s 2m docker builder prune --all --force; then
              echo "Docker builder cache cleanup timed out; continuing to the disk-space safety check."
            fi
            sudo docker image prune --force
            docker_root=$(sudo docker info --format '{{.DockerRootDir}}')
            available_kb=$(df -Pk "$docker_root" | awk 'NR == 2 {print $4}')
            if (( available_kb < 1048576 )); then
              echo "Refusing container restart: less than 1 GiB is free on the Docker filesystem." >&2
              exit 1
            fi

            sudo docker compose -f docker-compose-production.yml up -d

            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent http://localhost:8000/openapi.json >/dev/null \
                && curl --fail --silent --insecure --resolve fossbot.gr:443:127.0.0.1 https://fossbot.gr/ >/dev/null; then
                ready=true
                break
              fi
              sleep 2
            done

            if [[ "$ready" != true ]]; then
              sudo docker compose -f docker-compose-production.yml ps
              sudo docker compose -f docker-compose-production.yml logs --tail=100 backend frontend
              exit 1
            fi

            sudo docker compose -f docker-compose-production.yml ps
          EOF
