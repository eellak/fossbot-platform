services:
  local-https:
    image: caddy:2-alpine
    container_name: fossbot-local-https
    restart: unless-stopped
    ports:
      - "3443:443"
    environment:
      FOSSBOT_LOCAL_HOST: ${FOSSBOT_LOCAL_HOST:-${FOSSBOT_LOCAL_IP:-127.0.0.1}}
      FOSSBOT_LOCAL_API_UPSTREAM: ${FOSSBOT_LOCAL_API_UPSTREAM:-backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/caddy/pki/authorities/local/root.crt && wget -q --spider http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 6
    volumes:
      - ./front-end/build:/srv:ro
      - ./front-end/Caddyfile.local-https:/etc/caddy/Caddyfile:ro
      - local-https-data:/data

volumes:
  local-https-data:
